<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Organ Allocation System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>body{background:#f4f7fb;font-family:Inter,system-ui,sans-serif}.login-card{max-width:420px;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 12px 35px #0f172a12}</style>
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-3">
  <main class="card login-card w-100 p-4 p-md-5">
    <div class="text-center mb-4"><div class="text-primary fs-2">♥</div><h1 class="h4 fw-bold">Organ Allocation System</h1><p class="text-secondary small mb-0">Sign in to access the administration dashboard</p></div>
    <form id="login-form">
      <label class="form-label" for="username">Username</label><input class="form-control mb-3" id="username" autocomplete="username" required autofocus>
      <label class="form-label" for="password">Password</label><input class="form-control mb-3" id="password" type="password" autocomplete="current-password" required>
      <div id="login-error" class="small text-danger mb-3" role="alert"></div>
      <button class="btn btn-primary w-100" id="login-button" type="submit">Sign in</button>
    </form>
    <p class="text-muted small mt-4 mb-0">Academic prototype using synthetic records. Access is restricted to authorised project users.</p>
  </main>
<script>
document.getElementById('login-form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = document.getElementById('login-button');
  const errorBox = document.getElementById('login-error');
  button.disabled = true; button.textContent = 'Signing in…'; errorBox.textContent = '';
  try {
    const response = await fetch('/api/auth/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({username:document.getElementById('username').value, password:document.getElementById('password').value})});
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'Sign in failed.');
    window.location.href = '/';
  } catch (error) { errorBox.textContent = error.message; }
  finally { button.disabled = false; button.textContent = 'Sign in'; }
});
</script>
</body></html>
